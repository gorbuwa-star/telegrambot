<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заказа</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Правильное подключение Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased pb-24">

    <!-- БЛОК ОТЛАДКИ -->
    <div id="debug-log" class="bg-red-100 text-red-800 p-2 text-xs font-mono hidden break-all"></div>

    <!-- Шапка с поиском -->
    <div class="sticky top-0 bg-white shadow-sm p-4 z-10">
        <input type="text" id="search" placeholder="🔍 Поиск по названию..." 
               class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               oninput="filterItems()">
    </div>

    <!-- Таблица товаров -->
    <div class="max-w-md mx-auto p-4 space-y-3" id="catalog">
        <div class="text-center text-gray-400 py-10">Загрузка позиций...</div>
    </div>

    <!-- Фиксированная нижняя панель -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 flex flex-col items-center">
        <div class="text-lg font-bold mb-2">Итого: <span id="total-price">0</span> ₽</div>
        <button onclick="saveOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200">
            Сохранить изменения
        </button>
    </div>

    <script>
        function showDebug(msg) {
            const logBox = document.getElementById('debug-log');
            logBox.classList.remove('hidden');
            logBox.innerText += "\n[INFO]: " + msg;
        }

        let currentOrder = [];

        try {
            // Проверяем, доступен ли Telegram Web App
            let tg = null;
            try {
                tg = window.Telegram.WebApp;
                tg.expand();
                tg.ready();
                showDebug("Telegram Web App инициализирован");
            } catch (e) {
                showDebug("Telegram Web App недоступен, работаем в режиме просмотра");
                // Создаем заглушку для работы вне Telegram
                tg = {
                    sendData: function(data) {
                        showDebug("Данные для отправки: " + data);
                        alert("Данные сохранены!\n" + data);
                    },
                    close: function() {
                        showDebug("Закрытие приложения (заглушка)");
                    }
                };
                window.Telegram = { WebApp: tg };
            }

            // Читаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            const itemsParam = urlParams.get('items');

            if (itemsParam) {
                currentOrder = JSON.parse(decodeURIComponent(itemsParam));
                showDebug("Загружено товаров: " + currentOrder.length);
            } else {
                showDebug("Данные 'items' не найдены. Загружены демо-товары.");
                currentOrder = [
                    { item_id: 101, name: "Кабель ВВГнг 3x1.5", price: 120, quantity: 10 },
                    { item_id: 102, name: "Автомат 16А", price: 350, quantity: 5 },
                    { item_id: 103, name: "Розетка двойная", price: 280, quantity: 3 }
                ];
            }
            
            renderCatalog();

        } catch (error) {
            showDebug("Ошибка: " + (error.stack || error.message));
        }

        function renderCatalog() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            let total = 0;

            if (currentOrder.length === 0) {
                catalog.innerHTML = '<div class="text-center text-gray-400 py-10">Список товаров пуст</div>';
                return;
            }

            currentOrder.forEach(item => {
                total += item.price * item.quantity;
                
                const card = document.createElement('div');
                card.className = "item-card bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-gray-100";
                card.dataset.name = item.name.toLowerCase();
                card.innerHTML = `
                    <div class="pr-2 flex-1">
                        <div class="font-medium text-gray-800 break-words">${item.name}</div>
                        <div class="text-sm text-gray-400">${item.price} ₽ / шт.</div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 ml-2">
                        <button onclick="changeQty(${item.item_id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold hover:bg-gray-200 text-gray-600">−</button>
                        <input type="number" value="${item.quantity}" onchange="setQty(${item.item_id}, this.value)" class="w-16 text-center p-1 border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="changeQty(${item.item_id}, 1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold hover:bg-gray-200 text-gray-600">+</button>
                    </div>
                `;
                catalog.appendChild(card);
            });

            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function changeQty(id, delta) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                const newQty = item.quantity + delta;
                item.quantity = Math.max(0, newQty);
                // Удаляем товар, если количество стало 0
                if (item.quantity === 0) {
                    currentOrder = currentOrder.filter(i => i.item_id !== id);
                }
                renderCatalog();
            }
        }

        function setQty(id, val) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                const newQty = parseInt(val) || 0;
                if (newQty <= 0) {
                    currentOrder = currentOrder.filter(i => i.item_id !== id);
                } else {
                    item.quantity = newQty;
                }
                renderCatalog();
            }
        }

        function filterItems() {
            const query = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                if (card.dataset.name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function saveOrder() {
            try {
                // Проверяем, есть ли товары для сохранения
                const itemsToSave = currentOrder.filter(item => item.quantity > 0);
                if (itemsToSave.length === 0) {
                    alert('Нет товаров для сохранения');
                    return;
                }
                
                const data = JSON.stringify(itemsToSave);
                showDebug("Отправка данных: " + data);
                window.Telegram.WebApp.sendData(data);
                window.Telegram.WebApp.close();
            } catch (err) {
                showDebug("Ошибка отправки: " + err.message);
                alert("Ошибка при сохранении: " + err.message);
            }
        }

        // Отображение ошибок в консоли для разработки
        console.log("Приложение загружено. Товаров:", currentOrder.length);
    </script>
</body>
</html>
