<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заказа</title>
    <!-- Подключаем стили Tailwind для быстрой верстки -->
    <script src="https://jsdelivr.net"></script>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased pb-24">

    <!-- Шапка с поиском -->
    <div class="sticky top-0 bg-white shadow-sm p-4 z-10">
        <input type="text" id="search" placeholder="🔍 Поиск по названию..." 
               class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               oninput="filterItems()">
    </div>

    <!-- Таблица товаров -->
    <div class="max-w-md mx-auto p-4 space-y-3" id="catalog">
        <!-- Сюда JS вставит строки товаров из бота -->
    </div>

    <!-- Фиксированная нижняя панель -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 flex flex-col items-center">
        <div class="text-lg font-bold mb-2">Итого: <span id="total-price">0</span> ₽</div>
        <button onclick="saveOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200">
            Сохранить изменения
        </button>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем данные, которые передал бот в URL (initDataUnsafe)
        // В реальном проекте бот передает массив товаров через параметры URL, например: ?items=[...]
        const urlParams = new URLSearchParams(window.location.search);
        let currentOrder = [];

        try {
            currentOrder = JSON.parse(urlParams.get('items')) || [];
        } catch (e) {
            // Демо-данные на случай, если открыли просто в браузере для теста
            currentOrder = [
                { item_id: 101, name: "Кабель ВВГнг 3х2.5", price: 120, quantity: 500 },
                { item_id: 102, name: "Автомат 16А", price: 350, quantity: 20 }
            ];
        }

        // Рендер таблицы
        function renderCatalog() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            let total = 0;

            currentOrder.forEach(item => {
                total += item.price * item.quantity;
                
                const card = document.createElement('div');
                card.className = "item-card bg-white p-4 rounded-xl shadow-xs flex justify-between items-center border border-gray-100";
                card.dataset.name = item.name.toLowerCase();
                card.innerHTML = `
                    <div>
                        <div class="font-medium text-gray-800">${item.name}</div>
                        <div class="text-sm text-gray-400">${item.price} ₽ / шт.</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${item.item_id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-600">-</button>
                        <input type="number" value="${item.quantity}" onchange="setQty(${item.item_id}, this.value)" class="w-16 text-center p-1 border border-gray-200 rounded-md focus:outline-none">
                        <button onclick="changeQty(${item.item_id}, 1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-600">+</button>
                    </div>
                `;
                catalog.appendChild(card);
            });

            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function changeQty(id, delta) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, item.quantity + delta);
                renderCatalog();
            }
        }

        function setQty(id, val) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, parseInt(val) || 0);
                renderCatalog();
            }
        }

        // Поиск/Фильтрация
        function filterItems() {
            const query = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                if (card.dataset.name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Отправка данных обратно в Telegram-бота
        function saveOrder() {
            // Функция tg.sendData принимает ТОЛЬКО строку
            tg.sendData(JSON.stringify(currentOrder));
            tg.close(); // Закрываем Web App окно
        }

        // Первичный запуск
        renderCatalog();
    </script>
</body>
</html>
