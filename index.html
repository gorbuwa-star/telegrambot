<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заказа</title>
    <!-- Официальный скрипт Telegram Web App (Важно: подключаем самым первым) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем стили Tailwind -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased pb-24">

    <!-- БЛОК ОТЛАДКИ (Если всё сломается, он покажет текст ошибки прямо на экране) -->
    <div id="debug-log" class="bg-red-100 text-red-800 p-2 text-xs font-mono hidden break-all"></div>

    <!-- Шапка с поиском -->
    <div class="sticky top-0 bg-white shadow-sm p-4 z-10">
        <input type="text" id="search" placeholder="🔍 Поиск по названию..." 
               class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               oninput="filterItems()">
    </div>

    <!-- Таблица товаров -->
    <div class="max-w-md mx-auto p-4 space-y-3" id="catalog">
        <div class="text-center text-gray-400 py-10">Загрузка позиций...</div>
    </div>

    <!-- Фиксированная нижняя панель -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 flex flex-col items-center">
        <div class="text-lg font-bold mb-2">Итого: <span id="total-price">0</span> ₽</div>
        <button onclick="saveOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200">
            Сохранить изменения
        </button>
    </div>

    <script>
        // Функция для вывода ошибок на экран смартфона
        function showDebug(msg) {
            const logBox = document.getElementById('debug-log');
            logBox.classList.remove('hidden');
            logBox.innerText += "\n[ERROR]: " + msg;
        }

        let currentOrder = [];

        try {
            // Инициализируем Telegram
            const tg = window.Telegram.WebApp;
            tg.expand(); // Разворачиваем окно
            tg.ready();  // Сообщаем Telegram, что приложение готово к работе

            // Читаем параметры из URL-строки браузера
            const urlParams = new URLSearchParams(window.location.search);
            const itemsParam = urlParams.get('items');

            if (itemsParam) {
                // Если данные пришли от бота — парсим их
                currentOrder = JSON.parse(decodeURIComponent(itemsParam));
            } else {
                showDebug("Данные 'items' не найдены в URL. Загружены демо-товары.");
                // Резервный демо-список для тестов вне Telegram
                currentOrder = [
                    { item_id: 101, name: "Демо: Кабель ВВГнг", price: 120, quantity: 10 },
                    { item_id: 102, name: "Демо: Автомат 16А", price: 350, quantity: 5 }
                ];
            }
            
            // Запускаем отрисовку интерфейса
            renderCatalog();

        } catch (error) {
            showDebug(error.stack || error.message);
        }

        // Функция отрисовки интерфейса (Рендер)
        function renderCatalog() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            let total = 0;

            if (currentOrder.length === 0) {
                catalog.innerHTML = '<div class="text-center text-gray-400 py-10">Список товаров пуст</div>';
                return;
            }

            currentOrder.forEach(item => {
                total += item.price * item.quantity;
                
                const card = document.createElement('div');
                card.className = "item-card bg-white p-4 rounded-xl shadow-xs flex justify-between items-center border border-gray-100";
                card.dataset.name = item.name.toLowerCase();
                card.innerHTML = `
                    <div class="pr-2">
                        <div class="font-medium text-gray-800 break-words max-w-[180px]">${item.name}</div>
                        <div class="text-sm text-gray-400">${item.price} ₽ / шт.</div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <button onclick="changeQty(${item.item_id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-600">-</button>
                        <input type="number" value="${item.quantity}" onchange="setQty(${item.item_id}, this.value)" class="w-16 text-center p-1 border border-gray-200 rounded-md focus:outline-none">
                        <button onclick="changeQty(${item.item_id}, 1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-600">+</button>
                    </div>
                `;
                catalog.appendChild(card);
            });

            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function changeQty(id, delta) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, item.quantity + delta);
                renderCatalog();
            }
        }

        function setQty(id, val) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, parseInt(val) || 0);
                renderCatalog();
            }
        }

        function filterItems() {
            const query = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                if (card.dataset.name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function saveOrder() {
            try {
                window.Telegram.WebApp.sendData(JSON.stringify(currentOrder));
                window.Telegram.WebApp.close();
            } catch (err) {
                showDebug("Ошибка отправки данных: " + err.message);
            }
        }
    </script>
</body>
</html>
