<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заказа</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <!-- Быстрый и легкий CSS для красивого интерфейса -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased pb-24">

    <!-- Верхняя панель с поиском -->
    <div class="sticky top-0 bg-white shadow-md p-4 z-10">
        <input type="text" id="search" placeholder="🔍 Поиск по названию товара..." 
               class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
               oninput="renderCatalog()">
    </div>

    <!-- Контейнер для списка товаров -->
    <div class="max-w-md mx-auto p-4 space-y-3" id="catalog">
        <!-- Сюда JS вставит строки товаров -->
    </div>

    <!-- Фиксированная нижняя панель с суммой -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 flex flex-col items-center shadow-lg">
        <div class="text-xl font-bold mb-2">Итого: <span id="total-price">0</span> ₽</div>
        <button onclick="saveOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200">
            Сохранить изменения
        </button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let currentOrder = [];

        // Получаем данные из URL-строки от бота
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const itemsParam = urlParams.get('items');
            if (itemsParam) {
                currentOrder = JSON.parse(decodeURIComponent(itemsParam));
            } else {
                // Демо-данные для тестов в обычном браузере
                currentOrder = [
                    { item_id: 101, name: "Freedom", price: 120, quantity: 300 },
                    { item_id: 102, name: "Nina", price: 350, quantity: 200 },
                    { item_id: 103, name: "Mondial", price: 80, quantity: 600 }
                ];
            }
        } catch (e) {
            console.error("Ошибка парсинга данных:", e);
        }

        // Основная функция отрисовки (она же обрабатывает поиск)
        function renderCatalog() {
            const catalog = document.getElementById('catalog');
            const searchQuery = document.getElementById('search').value.toLowerCase().trim();
            catalog.innerHTML = '';
            
            let totalOrderSum = 0;

            // Сначала считаем общую сумму ВСЕГО заказа (чтобы она не занулялась от поиска)
            currentOrder.forEach(item => {
                totalOrderSum += item.price * item.quantity;
            });
            document.getElementById('total-price').innerText = totalOrderSum.toLocaleString();

            // Теперь фильтруем массив по поисковому запросу
            const filteredOrder = currentOrder.filter(item => {
                return item.name.toLowerCase().includes(searchQuery);
            });

            // Если ничего не нашли
            if (filteredOrder.length === 0) {
                catalog.innerHTML = '<div class="text-center text-gray-400 py-10">Товары не найдены</div>';
                return;
            }

            // Отрисовываем только найденные товары
            filteredOrder.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-gray-200";
                card.innerHTML = `
                    <div class="pr-2">
                        <div class="font-semibold text-gray-800 break-words max-w-[180px]">${item.name}</div>
                        <div class="text-sm text-gray-400">${item.price} ₽ / шт.</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${item.item_id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-700 text-center">-</button>
                        <input type="number" value="${item.quantity}" onchange="setQty(${item.item_id}, this.value)" class="w-16 text-center p-1 border border-gray-300 rounded-md focus:outline-none">
                        <button onclick="changeQty(${item.item_id}, 1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold active:bg-gray-200 text-gray-700 text-center">+</button>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

        // Изменение количества кнопками + и -
        function changeQty(id, delta) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, item.quantity + delta);
                renderCatalog(); // Перерисовываем экран со свежими цифрами
            }
        }

        // Прямой ввод цифр в окошко количества
        function setQty(id, val) {
            const item = currentOrder.find(i => i.item_id === id);
            if (item) {
                item.quantity = Math.max(0, parseInt(val) || 0);
                renderCatalog(); // Перерисовываем экран со свежими цифрами
            }
        }

        // Отправка данных обратно в бота
        function saveOrder() {
            try {
                tg.sendData(JSON.stringify(currentOrder));
                tg.close();
            } catch (err) {
                alert("Ошибка отправки данных в Telegram: " + err.message);
            }
        }

        // Первичный запуск отрисовки при открытии страницы
        renderCatalog();
    </script>
</body>
</html>
